<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <title>Mockup: StudyHub instructor dashboard</title>
  <desc>Tokens: background #f6f7fb, card #ffffff, accent #2f5bea, success #1f9d55, warning #d97706, error #dc2626, text #1b1f2a, muted #5b6275. Spacing 8/16/24 px, radius 8 px.</desc>
  <rect width="960" height="600" fill="#f6f7fb"/>
  <rect width="960" height="56" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#2f5bea">StudyHub</text>
  <text x="140" y="35" font-size="14" fill="#5b6275">Instructor dashboard · group CS-21</text>
  <circle cx="924" cy="28" r="14" fill="#2f5bea"/>

  <!-- stat cards -->
  <g>
    <rect x="24" y="80" width="296" height="96" rx="8" fill="#ffffff" stroke="#e3e6ef"/>
    <text x="40" y="108" font-size="13" fill="#5b6275">Group average score</text>
    <text x="40" y="150" font-size="34" font-weight="700" fill="#1b1f2a">78,5</text>
    <rect x="332" y="80" width="296" height="96" rx="8" fill="#ffffff" stroke="#e3e6ef"/>
    <text x="348" y="108" font-size="13" fill="#5b6275">Submissions received</text>
    <text x="348" y="150" font-size="34" font-weight="700" fill="#1f9d55">14 / 16</text>
    <rect x="640" y="80" width="296" height="96" rx="8" fill="#ffffff" stroke="#e3e6ef"/>
    <text x="656" y="108" font-size="13" fill="#5b6275">Submitted late</text>
    <text x="656" y="150" font-size="34" font-weight="700" fill="#d97706">3</text>
  </g>

  <!-- table -->
  <rect x="24" y="200" width="912" height="368" rx="8" fill="#ffffff" stroke="#e3e6ef"/>
  <text x="40" y="232" font-size="16" font-weight="700" fill="#1b1f2a">Scores by lab</text>
  <g font-size="13" fill="#5b6275" font-weight="600">
    <text x="40" y="266">Student</text>
    <text x="360" y="266">Lab 1</text>
    <text x="500" y="266">Lab 2</text>
    <text x="640" y="266">Lab 3</text>
    <text x="780" y="266">Lab 4</text>
  </g>
  <line x1="40" y1="276" x2="920" y2="276" stroke="#e3e6ef"/>
  <g font-size="14" fill="#1b1f2a">
    <text x="40" y="308">Ivanenko O. P.</text>
    <text x="360" y="308">95</text><text x="500" y="308">88</text><text x="640" y="308">76</text>
    <rect x="772" y="291" width="86" height="24" rx="12" fill="#fef3c7"/>
    <text x="786" y="308" font-size="12" fill="#d97706">Late: 56</text>
    <text x="40" y="348">Shevchenko A. I.</text>
    <text x="360" y="348">82</text><text x="500" y="348">74</text>
    <rect x="632" y="333" width="86" height="24" rx="12" fill="#fef3c7"/>
    <text x="646" y="348" font-size="12" fill="#d97706">Late: 63</text>
    <rect x="772" y="333" width="86" height="24" rx="12" fill="#e5e7eb"/>
    <text x="790" y="348" font-size="12" fill="#5b6275">Not submitted</text>
    <text x="40" y="388">Koval M. O.</text>
    <text x="360" y="388">100</text><text x="500" y="388">91</text><text x="640" y="388">85</text><text x="780" y="388">79</text>
    <text x="40" y="428">Bondarenko D. S.</text>
    <text x="360" y="428">60</text>
    <rect x="492" y="413" width="86" height="24" rx="12" fill="#fee2e2"/>
    <text x="508" y="428" font-size="12" fill="#dc2626">Returned</text>
    <rect x="632" y="413" width="86" height="24" rx="12" fill="#e5e7eb"/>
    <text x="650" y="428" font-size="12" fill="#5b6275">Not submitted</text>
    <rect x="772" y="413" width="86" height="24" rx="12" fill="#e5e7eb"/>
    <text x="790" y="428" font-size="12" fill="#5b6275">Not submitted</text>
  </g>
  <text x="40" y="470" font-size="12" fill="#5b6275">Nearest deadline: Lab 5 · 19.04.2026 23:59 (Kyiv) · 3 days left</text>
  <rect x="40" y="490" width="160" height="40" rx="8" fill="#2f5bea"/>
  <text x="62" y="515" font-size="14" font-weight="600" fill="#ffffff">Export to CSV</text>
  <text x="40" y="556" font-size="11" fill="#5b6275">Teaching mockup: invented students and data. Statuses: Submitted / Late / Returned / Not submitted.</text>
</svg>
